<!--
  Source for src/app/apple-icon.png. Rebuild with:

    rsvg-convert -w 180 -h 180 assets/apple-icon.svg -o src/app/apple-icon.png

  The same mark as src/app/icon.svg with one change: square corners. iOS applies
  its own rounded mask to a home-screen icon, so shipping the rounded variant
  produces a rounded shape clipped inside a rounded mask, which reads as a
  misaligned bevel on the corners.

  Every other value here is copied from icon.svg and must stay copied. It drifted
  once already — icon.svg was retuned (heavier stroke, tighter arcs, satellites
  brought onto the vertical axis) and this file was not, so the two icons were
  different marks for a while. If you touch one, diff the other.

  Colours are deliberately identical to icon.svg rather than to the app's tokens,
  so the two icons match each other. See the note in the commit about the mark's
  amber centre against the app's citron accent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#0B0B0A"></rect>

  <g fill="none" stroke="#F0EEE7" stroke-width="5" stroke-linecap="round">
    <path d="M20 27 A15 15 0 0 1 27 20"></path>
    <path d="M37 20 A15 15 0 0 1 44 27"></path>
    <path d="M20 37 A15 15 0 0 0 27 44"></path>
    <path d="M37 44 A15 15 0 0 0 44 37"></path>
  </g>

  <circle cx="32" cy="32" r="7" fill="#D6A85F"></circle>
  <circle cx="32" cy="15" r="3.5" fill="#F0EEE7"></circle>
  <circle cx="32" cy="49" r="3.5" fill="#F0EEE7"></circle>
</svg>
