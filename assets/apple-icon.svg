<!--
  Source for src/app/apple-icon.png. Rebuild with:

    rsvg-convert -w 180 -h 180 assets/apple-icon.svg -o src/app/apple-icon.png

  The same mark as src/app/icon.svg with one change: square corners. iOS applies
  its own rounded mask to a home-screen icon, so shipping the rounded variant
  produces a rounded shape clipped inside a rounded mask, which reads as a
  misaligned bevel on the corners.

  Colours are deliberately identical to icon.svg rather than to the app's tokens,
  so the two icons match each other. See the note in the commit about the mark's
  amber centre against the app's citron accent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#0B0B0A"></rect>

  <g fill="none" stroke="#EFEDE5" stroke-width="3" stroke-linecap="round">
    <path d="M18 22 A18 18 0 0 1 29 11"></path>
    <path d="M35 11 A18 18 0 0 1 46 22"></path>
    <path d="M18 42 A18 18 0 0 0 29 53"></path>
    <path d="M35 53 A18 18 0 0 0 46 42"></path>
  </g>

  <circle cx="32" cy="32" r="5" fill="#D6A85F"></circle>
  <circle cx="29" cy="17" r="3" fill="#EFEDE5"></circle>
  <circle cx="35" cy="47" r="3" fill="#EFEDE5"></circle>
</svg>
